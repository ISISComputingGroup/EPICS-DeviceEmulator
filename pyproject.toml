[build-system]
requires = ["setuptools", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "lewis-devices"
dynamic = ["version"]
description = "Emulators written using the lewis framework"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]

authors = [
  {name = "ISIS Experiment Controls", email = "ISISExperimentControls@stfc.ac.uk" }
]
maintainers = [
  {name = "ISIS Experiment Controls", email = "ISISExperimentControls@stfc.ac.uk" }
]

# Classifiers help users find your project by categorizing it.
#
# For a list of valid classifiers, see https://pypi.org/classifiers/
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",

  # Specify the Python versions you support here. In particular, ensure
  # that you indicate you support Python 3. These classifiers are *not*
  # checked by "pip install". See instead "requires-python" key in this file.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "lewis"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "pyright",
  "pytest",
  "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/isiscomputinggroup/lewis-devices"
"Bug Reports" = "https://github.com/isiscomputinggroup/lewis-devices/issues"
"Source" = "https://github.com/isiscomputinggroup/lewis-devices"


[tool.setuptools_scm]
version_file = "src/lewis_devices/version.py"

